<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="logos/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Herald Panji</title>
    <script>
      (function () {
        try {
          var seen = sessionStorage.getItem('hp:preloader-seen') === '1';
          var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (!seen && !reduce) document.documentElement.classList.add('is-preloading');
        } catch (e) {}
      })();
    </script>
    <style>html.is-preloading, html.is-preloading body { background: #f0f0f0; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
